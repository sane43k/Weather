<form class="search-form" [formGroup]="searchForm" (ngSubmit)="onSubmit()">
  <app-custom-input
    type="text"
    inputId="search-input"
    [placeholder]="'header.enterCity' | translate"
    formControlName="searchValue"
  ></app-custom-input>
  <button type="submit" class="btn btn-round" title="search">
    <svg
      xmlns="http://www.w3.org/2000/svg"
      height="24px"
      viewBox="0 -960 960 960"
      width="24px"
      fill="currentColor"
    >
      <path
        d="M784-120 532-372q-30 24-69 38t-83 14q-109 0-184.5-75.5T120-580q0-109 75.5-184.5T380-840q109 0 184.5 75.5T640-580q0 44-14 83t-38 69l252 252-56 56ZM380-400q75 0 127.5-52.5T560-580q0-75-52.5-127.5T380-760q-75 0-127.5 52.5T200-580q0 75 52.5 127.5T380-400Z"
      />
    </svg>
  </button>
  <div class="dropdown" [class.opened]="isOpened()">
    @if (citiesInfo().length === 0) { @for (cityName of searchHistory(); track
    $index) {
    <div class="dropdown__item" (click)="onSelectCity(cityName)">
      {{ cityName }}
    </div>
    } } @else { @for (cityInfo of citiesInfo(); track $index) {
    <div class="dropdown__item" (click)="onSelectCity(cityInfo.name)">
      {{ cityInfo.name }},
      {{ cityInfo.country }}
    </div>
    }}
  </div>
</form>
