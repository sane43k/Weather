<div class="city-card">
  <div class="city-card__main">
    <div class="city-card__info">
      <div class="city-card__name">Minsk</div>
      <div class="city-card__weather">Cloudy</div>
    </div>
    <div class="city-card__temp">7°</div>
  </div>
  <div class="city-card__details">
    <div class="city-card__feels">
      {{ "cityCard.feelsLike" | translate }}: <span>2°</span>
    </div>
    <div class="city-card__range">
      <span>{{ "cityCard.highest" | translate }}: 9°</span>
      <span>{{ "cityCard.lowest" | translate }}: 3°</span>
    </div>
  </div>
</div>
