<button
  type="button"
  class="btn btn-round"
  title="Open menu"
  (click)="openSidebar()"
>
  <svg
    xmlns="http://www.w3.org/2000/svg"
    height="24px"
    viewBox="0 -960 960 960"
    width="24px"
    fill="currentColor"
  >
    <path
      d="M120-240v-80h720v80H120Zm0-200v-80h720v80H120Zm0-200v-80h720v80H120Z"
    />
  </svg>
</button>

<div class="sidebar" [class.opened]="isOpened()">
  <button
    type="button"
    class="btn btn-round"
    title="Close menu"
    (click)="closeSidebar()"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      height="24px"
      viewBox="0 -960 960 960"
      width="24px"
      fill="currentColor"
    >
      <path
        d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z"
      />
    </svg>
  </button>

  <nav class="main-menu">
    <ul class="main-menu__list">
      <li class="main-menu__list__item">
        <app-nav-login-btn></app-nav-login-btn>
      </li>
      <li class="main-menu__list__item">
        <a routerLink="/favorites" class="link">{{
          "header.favorites" | translate
        }}</a>
      </li>
      <li class="main-menu__list__item">
        <a routerLink="/compare" class="link">{{
          "header.compare" | translate
        }}</a>
      </li>
    </ul>
  </nav>

  <div class="togglers-wrapper">
    <app-language-toggle></app-language-toggle>
    <app-theme-toggle></app-theme-toggle>
    <app-temperature-toggle></app-temperature-toggle>
  </div>

  <app-logo iconColor="blue"></app-logo>
</div>
