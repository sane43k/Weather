<section class="days-forecast-section">
  <div class="container">
    <div class="days-forecast">
      <div class="days-forecast-list">
        @for(dayForecast of daysForecast(); track $index) {
        <app-three-hour-forecast-card
          [forecast3Hour]="dayForecast"
          datePipeOption="dd.MM"
        ></app-three-hour-forecast-card>
        }
      </div>
      <app-line-chart
        [chartData]="chartData()"
        [legend]="false"
        xAxisLabel="date"
        yAxisLabel="temperature"
      ></app-line-chart>
    </div>
  </div>
</section>
